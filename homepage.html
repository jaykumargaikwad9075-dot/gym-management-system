    <style>
        *{
    margin:0px;
    padding:0px;

}

header{
    background-image: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5),rgba(0,0,0,0.5));
    height:100vh;
    background-size: cover;
    background-position: center;
    min-height: 100px;
}
ul{
    float:right ;
    list-style-type: none;
    margin-top: 30px;
    min-height: 400px;
    margin-right: 60px;
    font-size: 17px;

}
ul li{
    display:inline-block;
}
ul li a{
    text-decoration: none;
    color:#afff;
    padding: 5px 20px;
    border:1px solid transparent;
    transition: 0.5 ease;
}
ul li a:hover{
    background-color: #afff;
    color:#000;
}
ul li.active a{ 
    background-color: #afff;
    color:#000;
}
.logo img{
  float: left;
  width:225px;
  height:auto;
}
footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 20px;
}

.hero {
    
    background-size: cover;
    background-position: center;
    color: #ffffff;
    text-align: center;
    padding: 100px 0;
}

.hero-content {
    max-width: 600px;
    margin: 0 auto;
}

.btn {
    display: inline-block;
    background-color: #007bff;
    color: #fff;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 5px;
}
body{
